<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Reel · 代码动画生成器</title>
<style>
:root{
  --bg:#0c0c0d;
  --panel:#131315;
  --panel-2:#17171a;
  --line:#26262b;
  --line-2:#33333a;
  --txt:#e6e5e1;
  --dim:#8b8b91;
  --dim-2:#63636b;
  --accent:#e8663a;
  --accent-dim:#8f4327;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font-family:var(--sans);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:var(--accent);color:#fff}

/* ---------- 顶部 ---------- */
header{
  height:54px;flex:0 0 54px;display:flex;align-items:center;gap:16px;
  padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);
}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{
  font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:.22em;
}
.brand span{color:var(--dim-2);font-size:11px;letter-spacing:.06em}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.lang-badge{
  display:flex;align-items:center;gap:8px;
  border:1px solid var(--line-2);border-radius:999px;padding:4px 12px 4px 9px;
  font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.04em;
}
.lang-badge i{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 6px}
.lang-badge b{color:var(--txt);font-weight:600}

/* ---------- 主布局 ---------- */
main{
  flex:1;min-height:0;display:grid;
  grid-template-columns:340px minmax(320px,1fr) 306px;
}
.col{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:auto}
.col + .col{border-left:1px solid var(--line)}
.col-stage{background:#0a0a0b;overflow:hidden}

.sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{
  display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;
}
.sec-h h2{
  margin:0;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.24em;color:var(--dim-2);text-transform:uppercase;
}
.note{font-family:var(--mono);font-size:10px;color:var(--dim-2);letter-spacing:.04em}

/* ---------- 控件 ---------- */
textarea{
  width:100%;height:238px;resize:vertical;background:var(--panel-2);
  border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;
  font-family:var(--mono);font-size:12px;line-height:1.66;color:var(--txt);
  outline:none;transition:border-color .16s ease;
}
textarea:focus{border-color:var(--line-2)}
textarea::placeholder{color:var(--dim-2)}

select{
  width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;outline:none;cursor:pointer;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim-2) 50%),linear-gradient(135deg,var(--dim-2) 50%,transparent 50%);
  background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}
select:focus{border-color:var(--line-2)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--panel-2);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;cursor:pointer;color:var(--txt);
  transition:background .15s ease,border-color .15s ease,transform .12s ease;
  white-space:nowrap;
}
.btn:hover{background:#1f1f23;border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{background:#f07246;border-color:#f07246}
.btn-ghost{background:transparent}
.row{display:flex;gap:8px}
.row > *{flex:1}
.mt10{margin-top:10px}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  position:relative;display:flex;align-items:center;gap:7px;
  border:1px solid var(--line);border-radius:999px;background:transparent;
  padding:6px 12px 6px 10px;cursor:pointer;color:var(--dim);
  transition:color .15s ease,border-color .15s ease,background .15s ease;
}
.chip:before{
  content:"";width:5px;height:5px;border-radius:50%;background:var(--line-2);
  transition:background .15s ease;
}
.chip:hover{color:var(--txt);border-color:var(--line-2)}
.chip[aria-pressed="true"]{color:var(--txt);border-color:var(--accent-dim);background:rgba(232,102,58,.08)}
.chip[aria-pressed="true"]:before{background:var(--accent)}
.chip small{color:var(--dim-2);font-size:10px;font-family:var(--mono)}

.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{
  flex:1;background:transparent;border:0;padding:6px 0;cursor:pointer;color:var(--dim);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  transition:background .15s ease,color .15s ease;
}
.seg button + button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--txt)}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--txt)}

/* ---------- 关键帧时间轴 ---------- */
.timeline{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel);padding:9px 14px 11px}
.tl-head{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.tl-head h2{
  margin:0;font-family:var(--mono);font-size:10px;font-weight:600;
  letter-spacing:.24em;color:var(--dim-2);text-transform:uppercase;flex:0 0 auto;
}
.tl-head .note{margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-head .btn{flex:0 0 auto;padding:3px 10px;font-size:11px;border-radius:7px}
.tl-head .btn[aria-pressed="true"]{color:var(--txt);border-color:var(--accent-dim);background:rgba(232,102,58,.08)}
.tl-seg{flex:0 0 auto;width:128px;border-radius:7px}
.tl-seg button{padding:3px 0;font-size:11px;letter-spacing:0}
.tl-svg{display:block;width:100%;touch-action:none;cursor:crosshair}
.tl-svg text{font-family:var(--mono);user-select:none;pointer-events:none}
.tl-lab{font-size:9.5px;fill:var(--dim);letter-spacing:.06em}
.tl-tick{font-size:8.5px;fill:var(--dim-2)}
.tl-band{fill:#16161a}
.tl-band.alt{fill:#1c1c20}
.tl-sep{stroke:var(--line);stroke-width:1}
.tl-mid{stroke:var(--line-2);stroke-width:1;stroke-dasharray:2 3;opacity:.55}
.tl-curve{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.tl-dot{fill:var(--panel);stroke:var(--accent);stroke-width:1.5;cursor:grab}
.tl-dot.ro{cursor:default;stroke-width:1.2;opacity:.8}
.tl-dot.on{fill:var(--accent)}
.tl-dot.sel{fill:var(--accent);stroke:var(--txt);stroke-width:1.2}
.tl-sel{stroke:var(--accent);stroke-width:1;stroke-dasharray:3 3;opacity:.75}
.tl-snap{stroke:var(--txt);stroke-width:1;stroke-dasharray:1 3;opacity:.5}
.tl-dot.pick{cursor:pointer}
.tl-caret{stroke:var(--txt);stroke-width:1.1;opacity:.85}
.tl-caretmark{fill:var(--txt);opacity:.85}
.tl-tag{font-size:8.5px;fill:var(--dim)}
.tl-val{font-size:9px;fill:var(--txt)}

.field{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
.field label{color:var(--dim);font-size:12px}
.field .val{font-family:var(--mono);font-size:10.5px;color:var(--dim-2);min-width:42px;text-align:right}
input[type=range]{flex:1;accent-color:var(--accent);height:18px;cursor:pointer}

.switch{display:flex;align-items:center;justify-content:space-between;padding:5px 0;cursor:pointer;user-select:none}
.switch span{color:var(--dim);font-size:12px}
.switch input{appearance:none;width:34px;height:19px;border-radius:999px;background:#26262b;position:relative;cursor:pointer;transition:background .18s ease;flex:0 0 34px}
.switch input:after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#7d7d85;transition:transform .18s cubic-bezier(.22,1,.36,1),background .18s ease}
.switch input:checked{background:var(--accent-dim)}
.switch input:checked:after{transform:translateX(15px);background:var(--accent)}

/* ---------- 舞台 ---------- */
.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px}
.stage-inner{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
canvas{display:block;border-radius:12px;background:#0a0a0b;cursor:grab;touch-action:none}
canvas.dragging{cursor:grabbing}

.playbar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px;
  border-top:1px solid var(--line);background:var(--panel);
}
.playbar .btn-icon{width:34px;height:34px;padding:0;border-radius:50%}
.playbar .btn-icon svg{width:14px;height:14px;fill:currentColor}
.time{font-family:var(--mono);font-size:11px;color:var(--dim-2);letter-spacing:.03em;white-space:nowrap}
.time b{color:var(--txt);font-weight:600}
.playbar input[type=range]{flex:1}
.cliptag{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--accent);
  border:1px solid var(--accent-dim);border-radius:999px;padding:3px 10px;white-space:nowrap;
  text-transform:uppercase;
}

/* ---------- 溢出提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
  background:var(--panel-2);border:1px solid var(--line-2);border-radius:8px;
  padding:9px 16px;font-size:12px;opacity:0;pointer-events:none;
  transition:opacity .2s ease,transform .2s cubic-bezier(.22,1,.36,1);z-index:50;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- 入场动效（自下而上，无横向/缩放） ---------- */
@keyframes riseIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:riseIn .32s cubic-bezier(.22,1,.36,1) both}
.header-rise{animation:riseIn .3s cubic-bezier(.22,1,.36,1) both}

@media (max-width:1180px){
  body{overflow:auto;height:auto}
  main{grid-template-columns:1fr;display:block}
  .col + .col{border-left:0;border-top:1px solid var(--line)}
  .col-stage{height:auto}
  .stage-wrap{height:auto;min-height:280px}
  .stage-inner{height:auto}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <b>CODE&nbsp;REEL</b>
    <span>代码动画生成器</span>
  </div>
  <div class="hdr-right">
    <div class="lang-badge" id="langBadge"><i></i><span>识别</span><b>—</b></div>
  </div>
</header>

<main>
  <!-- 左：输入 -->
  <section class="col">
    <div class="sec">
      <div class="sec-h">
        <h2>源 代 码</h2>
        <span class="note" id="statNote">0 行 · 0 字符</span>
      </div>
      <textarea id="code" spellcheck="false" placeholder="在此粘贴代码…&#10;&#10;支持 JS / TS / Python / Java / Kotlin / C / C++ / C# / Go / Rust / Swift / PHP / Ruby / HTML / CSS / JSON / SQL / Shell / YAML&#10;粘贴后自动识别语言并着色。"></textarea>
      <div class="row mt10">
        <select id="langSel"></select>
      </div>
      <div class="row mt10">
        <button class="btn btn-ghost" id="btnSample">载入示例</button>
        <button class="btn btn-ghost" id="btnClear">清空</button>
      </div>
    </div>
  </section>

  <!-- 中：舞台 -->
  <section class="col col-stage">
    <div class="stage-wrap">
      <div class="stage-inner" id="stageInner">
        <canvas id="cv"></canvas>
      </div>
    </div>
    <div class="timeline">
      <div class="tl-head">
        <h2>关 键 帧 时 间 轴</h2>
        <div class="seg tl-seg" id="kfModeSeg">
          <button data-kf="basic" aria-pressed="true" title="按出现方式与镜头运动自动打点">基础版</button>
          <button data-kf="pro" aria-pressed="false" title="手动打点，可自由裁剪节奏">高级版</button>
        </div>
        <span class="note" id="kfNote"></span>
        <button class="btn btn-ghost" id="btnSnap" aria-pressed="true" title="吸附到片段边界 / 播放头 / 刻度 / 其他关键帧；按住 Alt 临时关闭">吸附</button>
        <button class="btn btn-ghost" id="btnKfAction">重新生成</button>
      </div>
      <svg class="tl-svg" id="tlSvg"></svg>
    </div>
    <div class="playbar">
      <button class="btn btn-primary btn-icon" id="btnPlay" title="播放 / 暂停">
        <svg id="icoPlay" viewBox="0 0 16 16"><path d="M3 1.7v12.6c0 .5.55.8.97.53l9.6-6.3a.63.63 0 0 0 0-1.06l-9.6-6.3A.63.63 0 0 0 3 1.7z"/></svg>
      </button>
      <button class="btn btn-icon" id="btnRestart" title="重播">
        <svg viewBox="0 0 16 16"><path d="M8 2.2V.6L4.6 3.3 8 6V4.2a3.8 3.8 0 1 1-3.8 3.8H2.4A5.6 5.6 0 1 0 8 2.2z"/></svg>
      </button>
      <span class="cliptag" id="clipTag">—</span>
      <input type="range" id="scrub" min="0" max="1000" value="0" step="1">
      <span class="time" id="timeLabel"><b>0.0</b> / 0.0 s</span>
    </div>
  </section>

  <!-- 右：控制 -->
  <section class="col">
    <div class="sec">
      <div class="sec-h"><h2>出 现 方 式</h2><span class="note">可多选</span></div>
      <div class="chips" id="revealChips"></div>
    </div>
    <div class="sec">
      <div class="sec-h"><h2>镜 头 运 动</h2><span class="note">可多选</span></div>
      <div class="chips" id="moveChips"></div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>节 奏</h2></div>
      <div class="field">
        <label>速度</label>
        <input type="range" id="speed" min="40" max="260" value="100" step="5">
        <span class="val" id="speedVal">1.0×</span>
      </div>
      <div class="field">
        <label>字号</label>
        <input type="range" id="fontSize" min="11" max="24" value="15" step="1">
        <span class="val" id="fontVal">15</span>
      </div>
      <p class="note" style="margin:9px 0 0">基础速度决定每段代码写多久；快慢节奏与镜头缩放、旋转请在舞台下方的<b>关键帧时间轴</b>里调。</p>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>画 面</h2></div>
      <select id="themeSel"></select>
      <div class="seg mt10" id="ratioSeg">
        <button data-ratio="16/9" aria-pressed="true">16 : 9</button>
        <button data-ratio="9/16" aria-pressed="false">9 : 16</button>
        <button data-ratio="1/1" aria-pressed="false">1 : 1</button>
      </div>
      <div class="field mt10">
        <label>视角</label>
        <span class="val" id="viewVal">0° · 0° · 0</span>
      </div>
      <button class="btn btn-ghost" id="btnResetView" style="width:100%">复位视角</button>
      <p class="note" style="margin:9px 0 0">拖动画面即把视角写入旋转关键帧（先在时间轴选点则写到那一刻）；视角最多转到 ±89°，不会翻到背面。滚轮调远近只是临时视角，双击复位。</p>
      <label class="switch mt10"><span>随光标跟随</span><input type="checkbox" id="optFollow"></label>
      <label class="switch"><span>自动运镜（3D）</span><input type="checkbox" id="optAutoCam"></label>
      <label class="switch"><span>行号</span><input type="checkbox" id="optGutter" checked></label>
      <label class="switch"><span>窗口边框</span><input type="checkbox" id="optChrome" checked></label>
      <label class="switch"><span>投影与网格</span><input type="checkbox" id="optShadow" checked></label>
    </div>

    <div class="sec">
      <div class="sec-h"><h2>输 出</h2><span class="note" id="durNote">—</span></div>
      <button class="btn btn-primary" id="btnExport" style="width:100%">导出视频（WebM）</button>
      <p class="note mt10" style="margin-bottom:0">按当前模式顺序录制为一段视频，实时录制，请勿切换窗口。</p>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* =========================================================
   Code Reel · 代码动画生成器
   单文件实现：多语言词法着色 + 自动识别 + Canvas 3D 动画渲染
   ========================================================= */

/* ---------------- 0. 基础工具 ---------------- */
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOutCubic = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const $ = s => document.querySelector(s);
const MONO = '"JetBrains Mono","Cascadia Mono","Cascadia Code",Consolas,"SF Mono",Menlo,monospace';

function rr(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function toast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("on"), 2200);
}

/* ---------------- 1. 语言定义 ---------------- */
function setOf(str) { return new Set(str.split(/\s+/).filter(Boolean)); }

const DEFAULT_OPS = ['>>>=', '===', '!==', '**=', '<<=', '>>=', '...', '=>', '==', '!=', '<=', '>=',
  '&&', '||', '??', '?.', '++', '--', '+=', '-=', '*=', '/=', '%=', '&=', '|=', '^=', '**',
  '::', '->', '<<', '>>', ':=', '!=', '..', '+', '-', '*', '/', '%', '<', '>', '&', '|', '^',
  '!', '~', '?', '=', '@', '#'];

const C_LIKE = {
  line: ['//'], block: [['/*', '*/']], pp: true, annot: true, charLit: true,
  strings: [{ o: '`', c: '`', t: 'str', esc: true, multi: true },
            { o: '"', c: '"', t: 'str', esc: true },
            { o: "'", c: "'", t: 'str', esc: true }],
};

const LANGS = {
  plain: { label: '纯文本', ext: 'txt', line: [], block: [], strings: [] },

  javascript: Object.assign({}, C_LIKE, {
    label: 'JavaScript', ext: 'js',
    kw: setOf('var let const function return if else for while do switch case default break continue new delete typeof instanceof in of class extends super this null undefined true false async await yield try catch finally throw import export from static get set void with debugger'),
    type: setOf('Array Object String Number Boolean Symbol Promise Map Set WeakMap WeakSet Date RegExp Error JSON Math Reflect Proxy BigInt Intl'),
    builtin: setOf('console document window globalThis process require module exports setTimeout setInterval fetch alert localStorage'),
  }),
  typescript: Object.assign({}, C_LIKE, {
    label: 'TypeScript', ext: 'ts', capType: true,
    kw: setOf('var let const function return if else for while do switch case default break continue new delete typeof instanceof in of class extends super this null undefined true false async await yield try catch finally throw import export from static get set void interface type enum implements declare namespace readonly public private protected abstract as satisfies keyof infer never unknown any string number boolean'),
    type: setOf('Array Object String Number Boolean Symbol Promise Map Set Record Partial Readonly Pick Omit Exclude Extract Date RegExp Error JSON Math'),
    builtin: setOf('console document window process require module exports setTimeout setInterval fetch'),
  }),
  python: {
    label: 'Python', ext: 'py', line: ['#'], block: [], annot: true, capType: true,
    strings: [{ o: '"""', c: '"""', t: 'str', esc: true, multi: true },
              { o: "'''", c: "'''", t: 'str', esc: true, multi: true },
              { o: '"', c: '"', t: 'str', esc: true },
              { o: "'", c: "'", t: 'str', esc: true }],
    kw: setOf('def class return if elif else for while in not and or is None True False import from as pass break continue with try except finally raise lambda yield global nonlocal assert del async await match case print self'),
    type: setOf('int float str bool list dict set tuple bytes object type range len enumerate zip map filter sum min max sorted open isinstance super'),
    builtin: setOf('print len range enumerate zip open int str float list dict set tuple type isinstance super'),
  },
  java: Object.assign({}, C_LIKE, {
    label: 'Java', ext: 'java', capType: true,
    kw: setOf('public private protected static final abstract synchronized class interface enum extends implements new return if else for while do switch case default break continue try catch finally throw throws this super null true false void package import instanceof assert record sealed var'),
    type: setOf('String Integer Long Double Float Boolean Character Object List Map Set ArrayList HashMap HashSet Optional Stream Arrays Collections System Math Exception RuntimeException Thread'),
    builtin: setOf('System Math Arrays Collections String Integer'),
  }),

function quickSort(arr, lo = 0, hi = arr.length - 1) {

/* ---------------- 2. 词法分析 ---------------- */
function isIdStart(c) { return /[A-Za-z_$\u00C0-\u024F\u4E00-\u9FA5]/.test(c); }
function isIdChar(c) { return /[A-Za-z0-9_$\u00C0-\u024F\u4E00-\u9FA5]/.test(c); }
function nextNonWs(code, i) {
  while (i < code.length && /\s/.test(code[i])) i++;
  return code[i] || '';
}

function tokenizeHTML(code) {
  const toks = [];
  const push = (type, text) => { if (text) toks.push({ type, text }); };
  let i = 0;
  const n = code.length;
  while (i < n) {
    if (code.startsWith('<\!--', i)) {
      let j = code.indexOf('--\>', i);
      j = j < 0 ? n : j + 3;
      push('com', code.slice(i, j)); i = j; continue;
    }
    if (code[i] === '<') {
      let j = i + 1;
      if (code[j] === '/') j++;
      if (code.startsWith('!DOCTYPE', j) || code.startsWith('!doctype', j)) {
        let e = i; while (e < n && code[e] !== '>') e++;
        push('meta', code.slice(i, e)); i = e; continue;
      }
      let k = j;
      while (k < n && /[A-Za-z0-9:_-]/.test(code[k])) k++;
      push('punct', code.slice(i, j));
      push('tag', code.slice(j, k));
      i = k;
      while (i < n && code[i] !== '>') {
        if (/\s/.test(code[i])) {
          let e = i; while (e < n && /\s/.test(code[e])) e++;
          push('ws', code.slice(i, e)); i = e; continue;
        }
        if (code[i] === '"' || code[i] === "'") {
          const q = code[i];
          let e = code.indexOf(q, i + 1);
          e = e < 0 ? n : e + 1;
          push('str', code.slice(i, e)); i = e; continue;
        }
        if (/[A-Za-z0-9_:@.\-\[]/.test(code[i])) {
          let e = i; while (e < n && /[A-Za-z0-9_:@.\-\]]/.test(code[e])) e++;
          const word = code.slice(i, e);
          push(nextNonWs(code, e) === '=' ? 'attr' : 'plain', word);
          i = e; continue;
        }
        push('op', code[i]); i++;
      }
      if (code[i] === '>') { push('punct', '>'); i++; }
      continue;
    }
    let j = code.indexOf('<', i);
    if (j < 0) j = n;
    push('plain', code.slice(i, j));
    i = j;
  }
  return toks;
}

function tokenize(code, L) {
  if (L.custom === 'html') return tokenizeHTML(code);
  const toks = [];
  const push = (type, text) => { if (text) toks.push({ type, text }); };
  const lineC = L.line || [];
  const blockC = L.block || [];
  const strings = L.strings || [];
  const ops = (L.ops || DEFAULT_OPS).slice().sort((a, b) => b.length - a.length);
  let i = 0, atLineStart = true;
  const n = code.length;

  while (i < n) {
    const c = code[i];

    /* 空白 */
    if (c === '\n') { push('ws', '\n'); i++; atLineStart = true; continue; }
    if (c === ' ' || c === '\t') {
      let j = i; while (j < n && (code[j] === ' ' || code[j] === '\t')) j++;
      push('ws', code.slice(i, j)); i = j; continue;
    }
    const wasLineStart = atLineStart;
    atLineStart = false;

    /* 行注释 */
    let hit = false;
    for (const m of lineC) {
      if (code.startsWith(m, i)) {
        let j = code.indexOf('\n', i);
        if (j < 0) j = n;
        push('com', code.slice(i, j)); i = j; hit = true; break;
      }
    }
    if (hit) continue;

    /* 块注释 */
    for (const pair of blockC) {
      if (code.startsWith(pair[0], i)) {
        let j = code.indexOf(pair[1], i + pair[0].length);
        j = j < 0 ? n : j + pair[1].length;
        push('com', code.slice(i, j)); i = j; hit = true; break;
      }
    }
    if (hit) continue;

    /* 预处理器 */
    if (L.pp && c === '#' && wasLineStart) {
      let j = i + 1; while (j < n && /[A-Za-z]/.test(code[j])) j++;
      push('meta', code.slice(i, j)); i = j; continue;
    }

    /* 注解 / 装饰器 */
    if (L.annot && c === '@' && isIdStart(code[i + 1] || '')) {
      let j = i + 1; while (j < n && isIdChar(code[j])) j++;
      push('meta', code.slice(i, j)); i = j; continue;
    }

    /* 字符串 */
    if (strings.length) {
      for (const s of strings) {
        if (!code.startsWith(s.o, i)) continue;
        if (s.o === "'" && L.charLit) {
          const close = code.indexOf("'", i + 1);
          if (close < 0 || close - i > 4) break;  /* 生命周期标记等，按符号处理 */
        }
        let j = i + s.o.length;
        let out = code.slice(i, j);
        while (j < n) {
          if (s.esc && code[j] === '\\') { out += code.slice(j, j + 2); j += 2; continue; }
          if (code.startsWith(s.c, j)) { out += s.c; j += s.c.length; break; }
          if (!s.multi && code[j] === '\n') break;
          out += code[j]; j++;
        }
        let type = s.t || 'str';
        if (L.strKey && nextNonWs(code, j) === ':') type = 'attr';
        push(type, out); i = j; hit = true; break;
      }
      if (hit) continue;
    }

    /* 数字 */
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(code[i + 1] || ''))) {
      let j = i;
      if (c === '0' && /[xXbBoO]/.test(code[i + 1] || '')) {
        j = i + 2; while (j < n && /[0-9a-fA-F_]/.test(code[j])) j++;
      } else {
        while (j < n && /[0-9_]/.test(code[j])) j++;
        if (code[j] === '.' && /[0-9]/.test(code[j + 1] || '')) {
          j++; while (j < n && /[0-9_]/.test(code[j])) j++;
        }
        if (/[eE]/.test(code[j] || '')) {
          let k = j + 1;
          if (/[+-]/.test(code[k] || '')) k++;
          if (/[0-9]/.test(code[k] || '')) {
            j = k; while (j < n && /[0-9]/.test(code[j])) j++;
          }
        }
      }
      while (j < n && /^[fFdDlLuU]$/.test(code[j])) j++;
      push('num', code.slice(i, j)); i = j; continue;
    }

    /* 标识符 */
    if (isIdStart(c)) {
      let j = i; while (j < n && isIdChar(code[j])) j++;
      const word = code.slice(i, j);
      const w = L.ciKw ? word.toLowerCase() : word;
      const next = nextNonWs(code, j);
      let type = 'plain';
      if (word[0] === '$' && L.dollar) type = 'var';
      else if (L.propNext && next === ':') type = 'attr';
      else if (L.kw && L.kw.has(w)) type = 'kw';
      else if (L.type && L.type.has(w)) type = 'type';
      else if (next === '(') type = 'fn';
      else if (L.capType && /^[A-Z][A-Za-z0-9_]*$/.test(word)) type = 'type';
      else if (word === 'self' || word === 'this' || word === 'super') type = 'kw';
      push(type, word); i = j; continue;
    }

    /* 运算符 / 标点 */
    let found = null;
    for (const o of ops) { if (code.startsWith(o, i)) { found = o; break; } }
    if (found) {
      push('()[]{},;:.'.includes(found[0]) && found.length === 1 ? 'punct' : 'op', found);
      i += found.length; continue;
    }
    push('()[]{},;:.'.includes(c) ? 'punct' : 'op', c);
    i++;
  }
  return toks;
}

function detectLanguage(code) {
  const len = code.length;
  if (len < 8) return { id: 'plain', score: 0, conf: 0 };
  const norm = Math.log10(len + 10);
  const scored = [];
  for (const [id, rules] of DETECT_RULES) {
    let raw = 0;
    for (const [re, w] of rules) {
      const m = code.match(re);
      if (m) raw += Math.min(m.length, 12) * w;
    }
    scored.push([id, raw / norm]);
  }
  scored.sort((a, b) => b[1] - a[1]);
  const best = scored[0], second = scored[1] || ['plain', 0.2];
  if (best[1] < 1.2) return { id: 'plain', score: best[1], conf: 0 };
  const conf = clamp(best[1] / (best[1] + second[1] + 0.4), 0, 1);
  return { id: best[0], score: best[1], conf };
}

/* ---------------- 7. 场景构建 ---------------- */
function normalizeCode(src) {
  let s = src.replace(/\r\n?/g, '\n');
  const fence = s.match(/^\s*```[^\n]*\n([\s\S]*?)\n?\s*```\s*$/);
  if (fence) s = fence[1];
  s = s.replace(/\t/g, '    ');
  s = s.replace(/\n{4,}/g, '\n\n\n');
  return s.replace(/\s+$/, '');
}

function splitLines(toks) {
  const lines = [[]];
  for (const tk of toks) {
    const parts = tk.text.split('\n');
    for (let i = 0; i < parts.length; i++) {
      if (i > 0) lines.push([]);
      if (parts[i]) lines[lines.length - 1].push({ type: tk.type, text: parts[i], cps: Array.from(parts[i]) });
    }
  }
  while (lines.length > 1 && lines[lines.length - 1].length === 0) lines.pop();
  return lines;
}

function charWeight(ch) {
  if (ch === ' ' || ch === '\t') return 0.7;
  if ('{}();'.includes(ch)) return 2.1;
  if (',:'.includes(ch)) return 1.5;
  return 1;
}

/* 全角判定：中日韩与表情占两个等宽字符位 */
function wide(ch) {
  const c = ch.codePointAt(0);
  return (c >= 0x1100 && c <= 0x115F) ||
    (c >= 0x2E80 && c <= 0xA4CF && c !== 0x303F) ||
    (c >= 0xAC00 && c <= 0xD7A3) ||
    (c >= 0xF900 && c <= 0xFAFF) ||
    (c >= 0xFE30 && c <= 0xFE4F) ||
    (c >= 0xFF00 && c <= 0xFF60) ||
    (c >= 0xFFE0 && c <= 0xFFE6) ||
    (c >= 0x1F300 && c <= 0x1FAFF) ||
    (c >= 0x20000 && c <= 0x3FFFD);
}

/* 每行的字符像素列偏移（等宽 + 全角双宽） */
function buildLineXs(lines) {
  for (const toks of lines) {
    const chars = [];
    for (const t of toks) for (const ch of t.cps) chars.push(ch);
    const xs = new Float64Array(chars.length + 1);
    let x = 0;
    for (let i = 0; i < chars.length; i++) {
      xs[i] = x;
      x += charW * (wide(chars[i]) ? 2 : 1);
    }
    xs[chars.length] = x;
    toks.xs = xs;
  }
}

/* 语法块划分：优先按括号深度（函数/循环等成块），无括号语言按缩进 */
function computeBlocks(lines) {
  const out = new Array(lines.length);
  const textOf = toks => toks.map(t => t.text).join('');
  const hasBrace = lines.some(l => textOf(l).indexOf('{') >= 0);
  if (hasBrace) {
    let depth = 0, cur = -1, closed = true;
    for (let li = 0; li < lines.length; li++) {
      if (closed) { cur++; closed = false; }
      out[li] = cur;
      const txt = textOf(lines[li]);
      let d = 0;
      for (const ch of txt) {
        if (ch === '{' || ch === '(' || ch === '[') d++;
        else if (ch === '}' || ch === ')' || ch === ']') d--;
      }
      depth += d;
      if (depth <= 0) { depth = 0; closed = true; }
    }
  } else {
    let cur = -1, prevInd = -1;
    for (let li = 0; li < lines.length; li++) {
      const txt = textOf(lines[li]);
      const ind = txt.length - txt.replace(/^\s+/, '').length;
      if (li === 0 || ind <= prevInd || txt.trim() === '') cur++;
      out[li] = cur;
      prevInd = ind;
    }
  }
  return out;
}

/* 为一种粒度生成单位序列（单位=一次“出现”） */
function buildGran(lines, gran) {
  const unitPos = [];
  const unitCost = [];
  const ranges = new WeakMap();

  /* 语法块粒度：同一块的各行共用一个单位 */
  if (gran === 'block') {
    const bid = scene.blockOf || [];
    let i = 0;
    while (i < lines.length) {
      const b = bid[i];
      let j = i;
      while (j < lines.length && bid[j] === b) j++;
      const start = unitPos.length;
      let chars = 0, lastCols = 0;
      for (let k = i; k < j; k++) {
        let c = 0;
        for (const t of lines[k]) c += t.cps.length;
        chars += c;
        lastCols = c;
      }
      unitCost.push(clamp(0.25 * chars + 1.0, 1.5, 5));
      unitPos.push({ line: j - 1, col: lastCols });
      for (let k = i; k < j; k++) {
        let col = 0;
        for (const t of lines[k]) {
          ranges.set(t, [start, start + 1]);
          t.colStart = col; t.colEnd = col + t.cps.length; t.line = k;
          col += t.cps.length;
        }
      }
      i = j;
    }
    const nb = unitPos.length;
    const cumb = new Float64Array(nb + 1);
    for (let k = 0; k < nb; k++) cumb[k + 1] = cumb[k] + unitCost[k];
    return { unitPos, unitCost, cum: cumb, ranges, total: cumb[nb] };
  }

  for (let li = 0; li < lines.length; li++) {
    const toks = lines[li];
    let col = 0;
    const lineChars = toks.reduce((a, t) => a + t.cps.length, 0);

    if (gran === 'line') {
      const start = unitPos.length;
      unitPos.push({ line: li, col: lineChars });
      unitCost.push(clamp(0.22 * lineChars + 0.8, 1.2, 4.6));
      for (const t of toks) {
        ranges.set(t, [start, start + 1]);
        t.colStart = col; t.colEnd = col + t.cps.length; t.line = li;
        col += t.cps.length;
      }
      continue;
    }

    for (const t of toks) {
      const start = unitPos.length;
      if (gran === 'token') {
        unitCost.push(clamp(0.35 * t.cps.length + 0.6, 0.8, 3.4));
        unitPos.push({ line: li, col: col + t.cps.length });
        ranges.set(t, [start, start + 1]);
      } else {
        for (let k = 0; k < t.cps.length; k++) {
          unitPos.push({ line: li, col: col + k });
          unitCost.push(charWeight(t.cps[k]));
        }
        ranges.set(t, [start, start + t.cps.length]);
      }
      t.colStart = col; t.colEnd = col + t.cps.length; t.line = li;
      col += t.cps.length;
    }

    if (li < lines.length - 1) {
      const nc = { line: Math.min(li + 1, lines.length - 1), col: 0 };
      unitPos.push(nc);
      unitCost.push(gran === 'char' ? 3.2 : 1.1);
    }
  }

  const n = unitPos.length;
  const cum = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) cum[i + 1] = cum[i] + unitCost[i];
  return { unitPos, unitCost, cum, ranges, total: cum[n] };
}

/* 时间 → 单位游标 */
function uOfCost(gd, targetCost) {
  const n = gd.unitCost.length;
  if (n === 0) return 0;
  if (targetCost <= 0) return 0;
  if (targetCost >= gd.total) return n;
  let lo = 0, hi = n;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (gd.cum[mid + 1] <= targetCost) lo = mid + 1; else hi = mid;
  }
  const i = Math.min(lo, n - 1);
  const c = gd.unitCost[i] || 1;
  return clamp(i + (targetCost - gd.cum[i]) / c, 0, n);
}

let measureCtx = document.createElement('canvas').getContext('2d');
let charW = 8, lineH = 24, fontPx = 15, pad = 24, gutterW = 44, titleH = 34;

function measureAt(fp, maxUnits, lineCount) {
  measureCtx.font = `${fp}px ${MONO}`;
  const cw = measureCtx.measureText('0'.repeat(20)).width / 20;
  const lh = Math.round(fp * 1.62);
  const g = S.gutter ? Math.max(36, String(lineCount).length * cw + 20) : 0;
  const p = Math.round(fp * 1.7);
  const th = S.chrome ? Math.round(fp * 2.4) : 0;
  const W = Math.ceil(p * 2 + g + maxUnits * cw + 2);
  const H = Math.ceil(p * 2 + th + lineCount * lh + 2);
  return { cw, lh, g, p, th, W, H };
}

function buildScene() {

  S.empty = !raw.trim();

  if (S.empty) {
    scene.ready = false;

    player.t = 0;
    if (S.kfMode === 'basic') applyAuto();   /* 基础版没有片段就没有编排 */
    tl.dirty = true;
    updateStats(0, 0);
